# Afrinext — PREVIEW environment (Render Blueprint)
#
# THIS IS NOT PRODUCTION AND MUST NEVER BECOME PRODUCTION.
#
# What this file describes is a deliberately fake shop: mock payments, no SMS
# provider, disposable data, its own database. It exists so Afrinext can be
# opened on a phone and used, and for nothing else. Two variables below say so
# out loud — ALLOW_MOCK_PAYMENTS and ALLOW_CONSOLE_SENDER — and the application
# refuses to start the mock provider or the console sender without them. That
# refusal is a feature: a real deployment that forgot to configure a payment
# provider fails loudly instead of quietly confirming payments nobody made.
#
# Not present here, and never to be added:
#   - IPAYMONEY_BASE_URL / IPAYMONEY_API_KEY / IPAYMONEY_WEBHOOK_SECRET / IPAYMONEY_ENVIRONMENT
#   - any real customer, real order or real money
#   - any secret VALUE (Render generates or stores those; Git holds none)
#
# One variable here has no production counterpart at all: ALLOW_PREVIEW_SELLERS.
# Read its note below before copying this file for any other environment.
#
# See docs/deployment/render-preview.md for the full procedure.

databases:
  # Its own database instance, created by this blueprint and referenced by name
  # below. Nothing here can be pointed at another database by editing a URL,
  # because no URL is written down: DATABASE_URL is wired from this resource.
  # A future production database is a different instance in a different
  # blueprint, and the two cannot be confused.
  - name: afrinext-preview-db
    databaseName: afrinext_preview
    user: afrinext_preview
    postgresMajorVersion: "16"
    # Frankfurt is the closest region Render offers to Niger. The web service
    # below MUST stay in the same region: a cross-region database call is a
    # slow application and, on Render, a public one.
    region: frankfurt
    plan: basic-256mb
    ipAllowList: []   # No external connections. Reach it through psql on the
                      # service shell, or temporarily add your own IP.

services:
  - type: web
    name: afrinext-preview
    runtime: node
    region: frankfurt
    # A paid instance type, and not for performance. A free instance has no
    # disk and is reclaimed when idle, which would delete every uploaded
    # product file — the digital engine would appear to lose people's purchases.
    plan: starter
    branch: claude/create-app-repository-1cxsih
    autoDeploy: true

    # `--prod=false` is deliberate. Render sets NODE_ENV=production for Node
    # services, and pnpm honours that by skipping devDependencies — which are
    # not optional here: `next build` needs typescript and tailwind, and the
    # migration runner is tsx. Without this flag the build fails at install.
    #
    # NODE_ENV itself is never set in this file. Every command already sets the
    # right value for itself, and overriding it has broken this build before;
    # see the note in .env.example.
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build

    # Runs after the build and BEFORE the new version receives traffic, so the
    # schema and the reference data are in place the first time anybody loads a
    # page. Seeding is not optional: authorization reads permissions and roles
    # from these tables, so an unseeded deployment refuses everything.
    # Both commands are idempotent and safe to run on every deploy.
    preDeployCommand: pnpm db:migrate && pnpm --filter @afrinext/core seed

    startCommand: pnpm start

    # Reports database reachability, migrations applied and reference data
    # seeded — the three things that are wrong first. It names no versions,
    # hosts or credentials.
    healthCheckPath: /api/health

    disk:
      # Uploaded product files. `FilesystemContentStorage` writes bytes to a
      # directory, so without a mounted disk they live in the container and
      # vanish on the next deploy. One gigabyte is far more than a preview
      # needs; it can be grown later but never shrunk.
      name: afrinext-preview-content
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # ---- database ----------------------------------------------------
      # Wired from the resource above; never typed, never in Git. This is
      # Render's internal connection string, so it stays on their private
      # network.
      - key: DATABASE_URL
        fromDatabase:
          name: afrinext-preview-db
          property: connectionString

      # A small database. Ten pooled connections per instance would be most of
      # its allowance spent on idle sockets.
      - key: DATABASE_POOL_MAX
        value: "5"

      # TEST_DATABASE_URL is deliberately ABSENT. Nothing in the running server
      # reads it; the vitest suite does, and it truncates every table it
      # touches. It must never be set on a deployment.

      # ---- secrets: generated by Render, stored by Render, never in Git ----
      # Signs sessions AND derives the HMAC key that signs download grants
      # (see apps/web/src/lib/content.ts). Rotating it signs everybody out and
      # invalidates every outstanding download token.
      - key: SESSION_SECRET
        generateValue: true

      # What the mock provider signs its webhooks with. Generated rather than
      # left at its default, because the default is a literal string published
      # in this repository — and anyone who knows it can confirm a payment.
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true

      # ---- the two statements that make this a preview -------------------
      # PAYMENT_PROVIDER alone is NOT enough to select the mock under a
      # production build. That is the variable a misconfigured deployment gets
      # wrong, so taking fake money requires a second, deliberate sentence.
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "yes"

      # No SMS provider is chosen for Niger yet, so verification codes are
      # written to this service's log and delivered nowhere. Anyone who can
      # read the log can sign in as any preview account — which is exactly why
      # ConsoleSender refuses to run without this being said explicitly.
      - key: ALLOW_CONSOLE_SENDER
        value: "yes"

      # Every account created here is granted the `seller` role at signup, so a
      # test account can open a shop without an operator running SQL.
      #
      # It is a GRANT, not a bypass: a real role_assignments row, revocable like
      # any other, and `authorize()` is not involved. The `seller` role holds
      # exactly one permission, `store.create` — no moderation, no admin, no
      # money — and per-store ownership is still granted by createStore to the
      # person who opened the store. Seller terms are still required.
      #
      # In production this would hand a shop to anybody who can receive an SMS.
      # It belongs to this preview service and nowhere else. See
      # packages/core/src/auth/preview-sellers.ts.
      - key: ALLOW_PREVIEW_SELLERS
        value: "yes"

      # ---- application ---------------------------------------------------
      # Must be the service's own public HTTPS URL, and it is not knowable
      # until Render has created the service. `sync: false` means Render asks
      # for it instead of assuming; set it after the first deploy and redeploy.
      # Until it is right, Better Auth builds links against localhost.
      - key: APP_URL
        sync: false

      # On the mounted disk, so uploaded files survive a deploy.
      - key: CONTENT_STORAGE_DIR
        value: /var/data/content

      - key: LOG_LEVEL
        value: info

      - key: NODE_VERSION
        value: "22"
